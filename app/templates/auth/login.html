{% extends "base.html" %}
{% block title %}Login - BookSea{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="text-center mb-4"><i class="bi bi-box-arrow-in-right text-primary"></i> Login</h3>

                {% if config.GOOGLE_CLIENT_ID %}
                <a href="https://accounts.google.com/o/oauth2/v2/auth?client_id={{ config.GOOGLE_CLIENT_ID }}&redirect_uri={{ url_for('auth.google_callback', _external=True) }}&response_type=code&scope=openid%20email%20profile"
                   class="btn btn-outline-danger w-100 mb-3">
                    <i class="bi bi-google"></i> Sign in with Google
                </a>
                <div class="divider my-3"><span>or</span></div>
                {% endif %}

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Username or Email</label>
                        <input type="text" class="form-control" name="login_id" required placeholder="Enter username or email">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" required placeholder="Enter password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>

                <p class="text-center mt-3 text-muted">
                    Don't have an account? <a href="{{ url_for('auth.signup') }}" class="text-primary">Sign Up</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
