{% extends "base.html" %}
{% block title %}Edit {{ filename }} - Admin{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3><i class="bi bi-pencil text-primary"></i> Edit: {{ filename }}</h3>
    <a href="{{ url_for('admin.file_manager', path='/'.join(filepath.split('/')[:-1])) }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Back</a>
</div>

<div class="card">
    <div class="card-header bg-transparent">
        <small class="text-muted">Path: /{{ filepath }}</small>
    </div>
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="path" value="{{ filepath }}">
            <div class="mb-3">
                <textarea class="form-control font-monospace" name="content" rows="25" style="font-size:13px;line-height:1.5;">{{ content }}</textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Save</button>
                <a href="{{ url_for('admin.file_manager', path='/'.join(filepath.split('/')[:-1])) }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
