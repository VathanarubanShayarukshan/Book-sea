{% extends "base.html" %}
{% block title %}Edit {{ filename }} - Admin{% endblock %}
{% block extra_css %}
<style>
    .editor-textarea { font-family: 'Fira Code', 'Consolas', 'Monaco', monospace; font-size: 13px; line-height: 1.6; tab-size: 4; }
</style>
{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <div>
        <h3 class="mb-1"><i class="bi bi-pencil text-primary"></i> Edit: {{ filename }}</h3>
        <small class="text-muted">Path: /{{ filepath }}</small>
    </div>
    <a href="{{ url_for('admin.file_manager', path='/'.join(filepath.split('/')[:-1])) }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Back</a>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="path" value="{{ filepath }}">
            <div class="mb-3">
                <textarea class="form-control editor-textarea" name="content" rows="30" style="min-height:500px;">{{ content }}</textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Save</button>
                <a href="{{ url_for('admin.file_manager', path='/'.join(filepath.split('/')[:-1])) }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
